apiVersion: v1
kind: Service
metadata:
  name: {{ include "pricebuddy.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ include "pricebuddy.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- with .Values.pricebuddy.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.pricebuddy.service.type }}
  ports:
    - port: {{ .Values.pricebuddy.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "pricebuddy.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
